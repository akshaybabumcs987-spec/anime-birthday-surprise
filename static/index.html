<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Birthday Surprise 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>🎂 Click Your Anime Heroes 🎂</h1>
    <p>Reveal their funny side!</p>
  </header>

  <main class="gallery">
    <div class="card" data-funny="images/funny1.jpg">
      <img src="images/Monkey_D_Luffy.png" alt="Luffy">
    </div>
    <div class="card" data-funny="images/funny2.jpg">
      <img src="images/Nezuko.jpg" alt="Nezuko">
    </div>
    <div class="card" data-funny="images/funny3.jpg">
      <img src="images/Roronoa_Zoro.jpg" alt="Zoro">
    </div>
    <div class="card" data-funny="images/funny4.jpg">
      <img src="images/Tanjirou_manga.png" alt="Tanjiro">
    </div>
  </main>

  <section id="birthdayNote">
    <h2>🎉 Happy Birthday! 🎉</h2>
    <p>
      You’ve unlocked your favorite heroes’ funny side!  
      <br>May your year be filled with joy, laughter, and epic adventures! 💥
    </p>
  </section>

  <canvas id="confettiCanvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
